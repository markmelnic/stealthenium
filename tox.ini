[tox]
envlist = py3{8,9,10,11,12,13}, flake8
minversion = 4.0.0
skip_missing_interpreters = true

[testenv]
deps =
    -r requirements.txt
    pytest
commands =
    python -m pytest {posargs} -s
extras = test

[testenv:flake8]
basepython = python3.12
deps = flake8
commands = flake8 .
skip_install = True
